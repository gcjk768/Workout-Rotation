services:
  gym-coach:
    build:
      context: .
      args:
        # Optional: pin Claude Code, e.g. sudo CLAUDE_CODE_VERSION=2.1.285 docker compose up -d --build
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    image: gym-coach-bot:local
    pull_policy: build   # Dockge "Update" rebuilds from these files instead of keeping the old image
    container_name: gym-coach-bot
    restart: unless-stopped
    init: true   # reaps helper processes that claude -p leaves behind
    stop_grace_period: 30s   # time to finish a reply before `docker compose down` stops it
    env_file: bot.env
    environment:
      PATH: "/fb:/home/coach/.local/bin:/root/.local/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    volumes:
      - /volume1/docker/claude-fallback:/fb:ro   # claude -p fallback wrapper (API key -> subscription); /fb is first on PATH
      # Plans, logs, shoulder ratings, check ins and chat memory. Include it in your NAS backups.
      - ./data:/data
      # garmin-monitor's data folder, read only. The bot reads monitor.db from it.
      # Change the left side if garmin-monitor lives elsewhere (Docker creates an
      # empty folder if this path does not exist, and /status then says so).
      - /volume1/docker/garmin-monitor/data:/garmin:ro
      # Obsidian vault: the movement log (Activity/) and memory (Workouts/, Exercises/).
      # Set VAULT_DIR=/vault in bot.env; leave VAULT_DIR empty to turn it off.
      - "/volume1/<USER>/Obsidian/Gym Coach:/vault"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g   # python plus one or two claude -p calls at a time
    healthcheck:   # the check imports the whole bot; give it room when the NAS is under heavy load
      test: ["CMD", "python", "/app/bot.py", "--health"]
      interval: 60s
      timeout: 120s
      start_period: 90s
      retries: 3
